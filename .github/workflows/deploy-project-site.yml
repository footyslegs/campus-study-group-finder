name: Deploy project site

on:
  push:
    branches: [ release ]
    paths:
      - 'code/project-site/**'
      - '.github/workflows/deploy-project-site.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: csgf-project-site

concurrency:
  group: deploy-project-site
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/project-site
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run site tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" code/project-site
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"

      - name: Roll out on EC2 (SSM Run Command)
        run: |
          IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=csgf-project-site" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -z "$IDS" ]; then echo "No running csgf-project-site instance found"; exit 1; fi
          CMD=$(aws ssm send-command --instance-ids $IDS --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" --parameters 'commands=["/usr/local/bin/deploy-site"]' \
            --query Command.CommandId --output text)
          for ID in $IDS; do
            aws ssm wait command-executed --command-id "$CMD" --instance-id "$ID" || true
            aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" \
              --query "{status:Status,output:StandardOutputContent,error:StandardErrorContent}" --output json
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" --query Status --output text)
            [ "$STATUS" = "Success" ] || exit 1
          done

      - name: Smoke test the live site
        run: |
          HOST=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=csgf-project-site" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicDnsName" --output text)
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "http://$HOST/" > /dev/null
          echo "Live at http://$HOST/"
